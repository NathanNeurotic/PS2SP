name: Sync PS2 catalog

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ps2sp-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Synchronize known projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run catalog:sync

      - name: Discover PS2 projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_DISCOVERY_API_REQUESTS: "450"
          GITHUB_CORE_RATE_LIMIT_RESERVE: "250"
          GITHUB_SEARCH_RATE_LIMIT_RESERVE: "2"
        run: npm run catalog:discover

      - name: Validate site
        run: npm run build

      - name: Commit catalog changes
        run: |
          if [ -z "$(git status --porcelain -- content/projects discovery/pending)" ]; then
            echo "Catalog already current."
            exit 0
          fi
          git config user.name "ps2sp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/projects discovery/pending
          git commit -m "chore(catalog): automated sync"
          git push
